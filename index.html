<!DOCTYPE html>
<html>
<head>
    <title>My URL Shortener</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; background: #f4f4f9; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 300px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shorten a URL</h1>
        <input type="text" id="longUrl" placeholder="Paste your long link here...">
        <button onclick="shorten()">Shorten</button>
        <div id="result"></div>
    </div>

    <script>
        async function shorten() {
            const longUrl = document.getElementById('longUrl').value;
            const res = await fetch('http://localhost:3000/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ longUrl })
            });
            const data = await res.json();
            if(data.shortUrl) {
                document.getElementById('result').innerHTML = `Short Link: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`;
            } else {
                alert("Error shortening URL");
            }
        }
    </script>
</body>
</html>
